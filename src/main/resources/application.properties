spring:
  datasource:
    url: jdbc:h2:file:./data/blackwood;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  mvc:
    format:
      date-time: iso
server:
  port: 8080
